version: '3.4'

services:
  aguacongas.FreeTheIdServer.private:
    ports:
      - "443"
    volumes:
      - ${APPDATA}/Microsoft/UserSecrets:/root/.microsoft/usersecrets:ro
    
  aguacongas.FreeTheIdServer.public:
    ports:
      - "5443:5443"
      - "5000:5000"
    volumes:
      - ${APPDATA}/Microsoft/UserSecrets:/root/.microsoft/usersecrets:ro
    restart: on-failure